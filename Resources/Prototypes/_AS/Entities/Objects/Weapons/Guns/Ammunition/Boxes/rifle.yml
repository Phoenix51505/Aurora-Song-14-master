    proto: ASCartridgeRifle60RubberLV
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
      color: "#845c42"
    - state: decal-01
      color: "#00ffff"
    - state: decal-calibre-60
    - state: mag-60-1
      map: ["enum.GunVisualLayers.Mag"]

