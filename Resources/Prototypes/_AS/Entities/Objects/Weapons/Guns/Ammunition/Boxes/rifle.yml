# Aurora Song
#region base
- type: entity
  id: ASBaseAmmunitionBoxRifle30Long
  parent: NFBaseAmmunitionBox
  name: ammunition box (.30 Long rifle)
  abstract: true
  components:
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - ASCartridgeRifle30Long
    proto: ASCartridgeRifle30Long
    capacity: 50
  - type: Sprite
    sprite: _NF/Objects/Weapons/Guns/Ammunition/Boxes/rifle.rsi

- type: entity
  id: ASAmmunitionBoxRifle30Long
  parent: ASBaseAmmunitionBoxRifle30Long
  name: ammunition box (.30 Long rifle)
  components:
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - ASCartridgeRifle30Long
    proto: ASCartridgeRifle30Long
  - type: Sprite
    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
      color: "#5b7b8c"
    - state: decal-calibre-30L
    - state: mag-1
      map: [ "enum.GunVisualLayers.Mag" ]
#region .60 rifle
- type: entity
  id: ASAmmunitionBoxRifle60Frangible
  parent: NFBaseAmmunitionBoxRifle60
  name: ammunition box (.60 rifle, frangible)
  components:
  - type: BallisticAmmoProvider
    proto: ASCartridgeRifle60Frangible
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
      color: "#845c42"
    - state: decal-01
      color: "#333333"
    - state: decal-calibre-60
    - state: mag-60-1
      map: ["enum.GunVisualLayers.Mag"]

- type: entity
  id: ASAmmunitionBoxRifle60RubberLV
  parent: NFBaseAmmunitionBoxRifle60
  name: ammunition box (.60 rifle, rubber, low velocity)
  components:
