- type: entity
  name: FTL Wake
  description: A temporary ripple in space left behind when a ship transits to FTL. 
  id: FTLWake
  components:
  - type: Sprite
    noRot: true
    drawdepth: Effects #it needs to draw over stuff.
    sprite: Structures/Specific/anomaly.rsi
    layers:
      - state: anom4
  - type: FTLWake
  - type: Stealth
    minVisibility: 0.4
    maxVisibility: 0.5
    examineThreshold: -0.1
  - type: Transform
    gridTraversal: false
  - type: InteractionOutline
  - type: Clickable
  - type: Appearance
  - type: AnimationPlayer
  - type: Physics
    bodyType: Static
    bodyStatus: InAir
  - type: AmbientSound
    range: 5
    volume: -5
    sound:
      path: /Audio/Ambience/anomaly_drone.ogg