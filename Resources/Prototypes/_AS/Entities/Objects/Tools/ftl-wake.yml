- type: entity
  id: WakeLocatorUnpowered
  parent: AnomalyLocatorUnpowered
  name: wake locator
  description: A device designed to aid in the locating of anomalies. Did you check the gas miners?
  suffix: Always Powered
  components:
  - type: ProximityDetector
    range: 512
    components:
    - type: FTLWake
  - type: Beeper
    minBeepInterval: 0.15
    maxBeepInterval: 4.00

- type: entity
  id: WakeLocator
  parent: [ WakeLocatorUnpowered, PowerCellSlotSmallItem ]
  suffix: ""
  components:
  - type: PowerCellDraw
    drawRate: 1
    useCharge: 0
  - type: ToggleCellDraw

- type: entity
  id: WakeLocatorEmpty
  parent: WakeLocator
  suffix: Empty
  components:
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        blacklist: # TheDen
          tags:
          - MantisCaster

- type: entity
  name: wake scanner
  parent: [BaseItem, RecyclableItemDeviceSmall] # Frontier: added RecyclableItemDeviceSmall, removed BaseSecurityContraband
  id: WakeScanner
  description: A handheld device that can scan objects for fingerprints and fibers.
  components:
  - type: Sprite
    sprite: _NF/Objects/Devices/forensic_scanner.rsi # Frontier: use _NF variant
    state: forensicnew # Frontier
  - type: Item
    size: Small
    storedRotation: 90
  - type: Clothing
    sprite: _NF/Objects/Devices/forensic_scanner.rsi # Frontier: add _NF
    quickEquip: false
    slots:
    - Belt
  - type: ActivatableUI
    key: enum.WakeScannerUiKey.Key
    inHandsOnly: true
    requireActiveHand: false
  - type: UserInterface
    interfaces:
      enum.WakeScannerUiKey.Key:
        type: WakeScannerBoundUserInterface
  - type: WakeScanner
  - type: GuideHelp
    guides:
    - Forensics
  - type: Appearance # Frontier
